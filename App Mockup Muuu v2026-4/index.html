<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Viewport: sin zoom, respeta safe-areas (notch/Dynamic Island) ── -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Theme color: tiñe la barra del navegador en Android Chrome ──── -->
    <!-- El valor inicial es morado (pantalla de inicio/estudiante).        -->
    <!-- MuuuApp.tsx lo actualiza dinámicamente según la pantalla activa.   -->
    <meta name="theme-color" content="#7952B3" />

    <!-- ── iOS Safari: barra de estado transparente sobre el header ─────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Muuu</title>

    <style>
      html, body {
        height: 100%;
        margin: 0;
        background-color: #7952B3; /* morado inicial; JS lo cambia según pantalla */
        transition: background-color 0.3s ease;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
