# ============================================================
#  MUUU APP · Nginx — Producción (Render.com)
#  El placeholder __PORT__ es reemplazado en el entrypoint
#  con sed antes de iniciar nginx.
# ============================================================

server {
    listen __PORT__;
    server_name _;

    charset utf-8;
    client_max_body_size 55M;

    # ── React SPA ────────────────────────────────────────────
    root /var/www/html/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API PHP ───────────────────────────────────────────────
    location /api/ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  /var/www/html/index.php;
        fastcgi_param  REQUEST_URI      $request_uri;
        fastcgi_read_timeout 120;
        include        fastcgi_params;
    }

    # ── Archivos subidos por docentes ─────────────────────────
    location /uploads/ {
        alias /var/www/html/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── Health-check (Render lo usa para saber si el servicio vive) ──
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── No exponer archivos sensibles ─────────────────────────
    location ~ /\.(env|git|ht) {
        deny all;
    }

    # Logs → stdout/stderr para que Render los capture
    error_log  /dev/stderr warn;
    access_log /dev/stdout combined;
}
