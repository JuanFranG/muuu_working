# ============================================================
#  MUUU APP · Nginx — Producción (Render.com)
#  El placeholder __PORT__ es reemplazado en el entrypoint
#  con sed antes de iniciar nginx.
# ============================================================

server {
    listen __PORT__;
    server_name _;

    charset utf-8;
    client_max_body_size 55M;

    # ══════════════════════════════════════════════════════════
    #  HEADERS DE SEGURIDAD
    # ══════════════════════════════════════════════════════════

    # ── Content Security Policy ───────────────────────────────
    # 'unsafe-eval'   → Vite code-splitting / algunas dependencias usan eval
    # 'unsafe-inline' → estilos en línea de React / KaTeX
    # data:           → fuentes KaTeX embebidas (woff2) y fotos en base64
    # blob:           → workers de algunas librerías
    # https:          → imágenes externas (YouTube, Google Drive, etc.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https:; worker-src blob:;" always;

    # ── HSTS: forzar HTTPS por 1 año ─────────────────────────
    # Render ya termina TLS en su load balancer; activar es seguro.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Clickjacking: solo permite iframes del mismo origen ──
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ── MIME sniffing: el navegador respeta Content-Type ─────
    add_header X-Content-Type-Options "nosniff" always;

    # ── Referrer: enviar origen solo en requests same-origin ─
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Permissions Policy: deshabilitar APIs no usadas ──────
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ── XSS Protection (navegadores legacy) ──────────────────
    add_header X-XSS-Protection "1; mode=block" always;

    # ── React SPA ────────────────────────────────────────────
    root /var/www/html/dist;
    index index.html;

    # index.html nunca se cachea — garantiza que el browser
    # siempre cargue el último build de Vite
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }

    # Assets con hash de Vite: cache agresivo (1 año)
    location ~* \.(js|css|woff2?|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API PHP ───────────────────────────────────────────────
    location /api/ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  /var/www/html/index.php;
        fastcgi_param  REQUEST_URI      $request_uri;
        # Render termina TLS en su load balancer y reenvía HTTP al contenedor.
        # Indicamos a PHP que la conexión EXTERIOR es HTTPS para que genere
        # cookies con Secure y evitar redirect loops.
        fastcgi_param  HTTPS            "on";
        fastcgi_param  HTTP_X_FORWARDED_PROTO "https";
        fastcgi_read_timeout 120;
        include        fastcgi_params;
    }

    # ── Archivos subidos por docentes ─────────────────────────
    location /uploads/ {
        alias /var/www/html/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── Health-check (Render lo usa para saber si el servicio vive) ──
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── No exponer archivos sensibles ─────────────────────────
    location ~ /\.(env|git|ht) {
        deny all;
    }

    # Logs → stdout/stderr para que Render los capture
    error_log  /dev/stderr warn;
    access_log /dev/stdout combined;
}
