# ============================================================
#  MUUU APP · Nginx — Producción (Render.com)
#  Escucha en $PORT (inyectado por Render, default 10000).
#
#  Todo va en el mismo contenedor:
#    /           → React SPA (dist/)
#    /api/*      → PHP-FPM (mismo contenedor, socket unix o TCP)
#    /uploads/*  → Archivos estáticos del disco persistente
# ============================================================

server {
    listen ${PORT};
    server_name _;

    charset utf-8;
    client_max_body_size 55M;

    # ── Headers de seguridad ─────────────────────────────────
    add_header X-Content-Type-Options  nosniff always;
    add_header X-Frame-Options         SAMEORIGIN always;
    add_header Referrer-Policy         strict-origin-when-cross-origin always;

    # ── React SPA ────────────────────────────────────────────
    # Sirve la app desde /dist; todo lo que no exista →  index.html
    root /var/www/html/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API PHP ───────────────────────────────────────────────
    # Todas las rutas /api/* van a PHP-FPM (mismo host, TCP 9000)
    location /api/ {
        root /var/www/html;

        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;

        # El front-controller es siempre backend/index.php
        fastcgi_param  SCRIPT_FILENAME  /var/www/html/index.php;
        fastcgi_param  REQUEST_URI      $request_uri;
        include        fastcgi_params;

        # Tamaño de body para subida de archivos
        fastcgi_read_timeout 120;
    }

    # ── Archivos subidos por docentes ─────────────────────────
    # El disco persistente de Render se monta en /var/www/html/uploads
    location /uploads/ {
        alias /var/www/html/uploads/;

        # Caché de 30 días para imágenes y PDFs
        add_header Cache-Control "public, max-age=2592000, immutable";
        expires 30d;
    }

    # ── Evita exponer archivos sensibles ─────────────────────
    location ~ /\.(env|git|ht) {
        deny all;
    }

    # ── Health-check (Render lo utiliza para saber si el servicio está vivo) ──
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Logs (van a stdout/stderr para que Render los capture)
    error_log  /dev/stderr warn;
    access_log /dev/stdout combined;
}
