# ============================================================
#  MUUU APP · Nginx — Proxy inverso para la API PHP
#  Escucha en :80 dentro del contenedor → host :8080
#
#  El frontend React (Vite) corre separado en :5173
#  y tiene su propio proxy configurado hacia aquí.
# ============================================================

server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php;

    # Charset y headers de seguridad básicos
    charset utf-8;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # Tamaño máximo de body para uploads (50 MB)
    client_max_body_size 55M;

    # ----------------------------------------------------------
    # /api/* → router JSON (backend/index.php)
    # ----------------------------------------------------------
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ----------------------------------------------------------
    # /vista/* → vistas clásicas PHP (MVC Opción B)
    #  Acceso: http://localhost:8080/vista/?action=login
    # ----------------------------------------------------------
    location /vista/ {
        try_files $uri $uri/ /vista/index.php?$query_string;
    }

    # ----------------------------------------------------------
    # /uploads/* → archivos estáticos subidos por docentes
    # ----------------------------------------------------------
    location /uploads/ {
        alias /var/www/html/uploads/;
        add_header Access-Control-Allow-Origin "http://localhost:5173" always;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    # ----------------------------------------------------------
    # Procesamiento PHP via FPM
    # ----------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;

        # CORS para el frontend en desarrollo (localhost:5173)
        add_header Access-Control-Allow-Origin  "http://localhost:5173" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Responde preflight OPTIONS sin llegar a PHP
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ----------------------------------------------------------
    # Evita exponer archivos sensibles
    # ----------------------------------------------------------
    location ~ /\.(env|git|ht) {
        deny all;
    }

    # Logs
    error_log  /var/log/nginx/muuu_error.log;
    access_log /var/log/nginx/muuu_access.log;
}
