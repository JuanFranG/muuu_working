# ============================================================
#  MUUU APP · Docker Compose
#  Universidad del Magdalena · 2026-I
#
#  Servicios:
#    mysql   → Base de datos MySQL 8.0  (host: localhost:3307)
#    php     → PHP 8.3-FPM + extensiones (interno: 9000)
#    nginx   → Proxy inverso            (host: localhost:8080)
#
#  Frontend (React/Vite) corre SEPARADO con:
#    cd "App Mockup Muuu v2026-3" && npm run dev   → localhost:5173
# ============================================================

services:

  # ----------------------------------------------------------
  # 1. MySQL 8.0
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: muuu_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE}
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_HOST_PORT}:3306"
    volumes:
      - muuu_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - muuu_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------
  # 2. PHP 8.3-FPM
  # ----------------------------------------------------------
  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: muuu_php
    restart: unless-stopped
    environment:
      DB_HOST:     ${DB_HOST}
      DB_PORT:     ${DB_PORT}
      DB_NAME:     ${DB_NAME}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backend:/var/www/html
    networks:
      - muuu_net
    depends_on:
      mysql:
        condition: service_healthy

  # ----------------------------------------------------------
  # 3. Nginx
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: muuu_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html:ro
    networks:
      - muuu_net
    depends_on:
      - php

# ----------------------------------------------------------
# Volúmenes y red
# ----------------------------------------------------------
volumes:
  muuu_mysql_data:
    driver: local

networks:
  muuu_net:
    driver: bridge
